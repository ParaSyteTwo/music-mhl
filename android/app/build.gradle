apply plugin: 'com.android.application'

android {
    namespace = "com.mhl.music"
    compileSdk = rootProject.ext.compileSdkVersion
    lintOptions {
        abortOnError false
    }
    lint {
        abortOnError false
    }
    defaultConfig {
        applicationId "com.mhl.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        release {
            storeFile file('mhl-release-key.jks')
            storePassword 'mhlmusic123'
            keyAlias 'mhl-key'
            keyPassword 'mhlmusic123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // youtubedl-android: yt-dlp + ffmpeg for local YouTube audio extraction
    // v0.18.1 has Python 3.11 (required by latest yt-dlp) + quickJS for YouTube
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'

// Ensure latest yt-dlp binary is present in android assets before building
// This will run the project script `scripts/download-and-integrate-yt-dlp.ps1` on Windows
// or attempt to run it with `sh` on Unix-like environments.
task downloadYtDlp(type: Exec) {
    // Resolve script path relative to the repo root (two levels up from android/app)
    def scriptPath = new File(projectDir, '../../scripts/download-and-integrate-yt-dlp.ps1').canonicalPath
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', scriptPath
    } else {
        // On Unix, try to run the script with sh if available (script should handle chmod)
        commandLine 'sh', '-c', scriptPath
    }
}

// Skip the download task if the asset already exists (manual integration)
downloadYtDlp.onlyIf {
    def existing = file('src/main/assets/yt-dlp')
    !existing.exists()
}

preBuild.dependsOn downloadYtDlp
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
