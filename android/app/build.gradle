apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    keystoreProperties.getProperty(propertyName) ?: System.getenv(environmentName)
}

def releaseStoreFile = signingValue('storeFile', 'MHL_ANDROID_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'MHL_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'MHL_ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'MHL_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.trim().isEmpty() }

android {
    namespace = "com.mhl.music"
    compileSdk = rootProject.ext.compileSdkVersion
    lintOptions {
        abortOnError false
    }
    lint {
        abortOnError false
    }
    defaultConfig {
        applicationId "com.mhl.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "1.5.1-beta.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField(
            "boolean",
            "MHL_EMULATOR_BUILD",
            System.getenv('MHL_ANDROID_EMULATOR_BUILD') == '1' ? 'true' : 'false'
        )
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
            if (System.getenv('MHL_ANDROID_EMULATOR_BUILD') == '1') {
                abiFilters "x86_64"
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('verifyReleaseSigningConfig') {
    group = 'verification'
    description = 'Verifies that the Android release signing configuration is complete.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                'Missing Android release signing configuration. Copy keystore.properties.example ' +
                'to keystore.properties or define the MHL_ANDROID_* environment variables.'
            )
        }
        def configuredStoreFile = rootProject.file(releaseStoreFile)
        if (!configuredStoreFile.exists()) {
            throw new GradleException("Android release keystore not found: ${configuredStoreFile}")
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyReleaseSigningConfig')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // youtubedl-android: yt-dlp + ffmpeg for local YouTube audio extraction
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    
    // jaudiotagger for native M4A tagging without ffmpeg execution
    implementation 'net.jthink:jaudiotagger:3.0.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.register('verifyBundledYtDlp') {
    group = 'verification'
    description = 'Verifies that the Android yt-dlp asset required by the native runtime exists.'
    doLast {
        def bundledYtDlp = file('src/main/assets/yt-dlp')
        if (!bundledYtDlp.exists() || bundledYtDlp.length() == 0) {
            throw new GradleException(
                "Missing Android yt-dlp asset: ${bundledYtDlp}. " +
                "Restore the versioned asset before building."
            )
        }
    }
}

preBuild.dependsOn tasks.named('verifyBundledYtDlp')

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
