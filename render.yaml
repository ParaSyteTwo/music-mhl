services:
  - type: web
    runtime: static
    name: music-mhl
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
        - tsconfig.app.json
        - tsconfig.node.json
        - tailwind.config.ts
        - postcss.config.js
        - eslint.config.js
        - components.json
        - render.yaml
      ignoredPaths:
        - android/**
        - services/**
        - supabase/**
        - docs/**
        - .claude/**
        - dev-dist/**
        - dist/**
        - "*.apk"
        - "*.mp3"
        - ".tmp-*"
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
