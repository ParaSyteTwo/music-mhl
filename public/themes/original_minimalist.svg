<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="matteBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="originalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#matteBlack)"/>
  <!-- Minimalist sound waves -->
  <path d="M 40 120 L 80 120 L 110 50 L 150 190 L 190 70 L 230 160 L 260 90 L 290 120 L 360 120" 
        stroke="#C8F04B" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#originalGlow)"/>
  <circle cx="150" cy="190" r="4" fill="#C8F04B" filter="url(#originalGlow)"/>
  <circle cx="110" cy="50" r="4" fill="#C8F04B" filter="url(#originalGlow)"/>
</svg>
