<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Synthwave Sky -->
    <linearGradient id="synthSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B0A26"/>
      <stop offset="60%" stop-color="#4A154B"/>
      <stop offset="100%" stop-color="#2E0A36"/>
    </linearGradient>

    <!-- Retro Sun -->
    <linearGradient id="retroSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>

    <!-- Grid Glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="sunClip">
      <circle cx="200" cy="110" r="60"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#synthSky)"/>

  <!-- Segmented Sunset -->
  <g clip-path="url(#sunClip)">
    <rect x="140" y="50" width="120" height="120" fill="url(#retroSun)"/>
    <!-- Vaporwave Segmentation (scanlines) -->
    <rect x="140" y="105" width="120" height="3" fill="#2E0A36"/>
    <rect x="140" y="115" width="120" height="4" fill="#2E0A36"/>
    <rect x="140" y="126" width="120" height="6" fill="#2E0A36"/>
    <rect x="140" y="140" width="120" height="8" fill="#2E0A36"/>
    <rect x="140" y="156" width="120" height="14" fill="#2E0A36"/>
  </g>

  <!-- Horizon Line -->
  <line x1="0" y1="140" x2="400" y2="140" stroke="#F43F5E" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Perspective Wireframe Grid -->
  <g stroke="#D946EF" stroke-width="1" opacity="0.7" filter="url(#neonGlow)">
    <!-- Horizontal lines -->
    <line x1="0" y1="150" x2="400" y2="150" opacity="0.3"/>
    <line x1="0" y1="165" x2="400" y2="165" opacity="0.5"/>
    <line x1="0" y1="185" x2="400" y2="185" opacity="0.7"/>
    <line x1="0" y1="215" x2="400" y2="215" opacity="0.9"/>
    
    <!-- Vertical perspective lines -->
    <line x1="200" y1="140" x2="200" y2="240"/>
    <line x1="200" y1="140" x2="100" y2="240"/>
    <line x1="200" y1="140" x2="300" y2="240"/>
    <line x1="200" y1="140" x2="0" y2="240"/>
    <line x1="200" y1="140" x2="400" y2="240"/>
    <line x1="200" y1="140" x2="-100" y2="240"/>
    <line x1="200" y1="140" x2="500" y2="240"/>
  </g>
</svg>
