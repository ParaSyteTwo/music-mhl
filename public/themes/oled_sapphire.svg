<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="nebula" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1C3D"/>
      <stop offset="60%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Sapphire Crystal Gradients -->
    <linearGradient id="sapphireLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="sapphireDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Star Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space OLED Background -->
  <rect width="400" height="240" fill="#000000"/>
  <rect width="400" height="240" fill="url(#nebula)"/>

  <!-- Starfield (Generated Atoms) -->
  <circle cx="50" cy="40" r="1.5" fill="#E0F2FE" filter="url(#glow)"/>
  <circle cx="120" cy="180" r="2" fill="#BAE6FD" filter="url(#glow)"/>
  <circle cx="320" cy="60" r="1" fill="#7DD3FC"/>
  <circle cx="280" cy="200" r="1.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="180" cy="90" r="0.8" fill="#FFFFFF"/>
  <circle cx="360" cy="140" r="1.2" fill="#E0F2FE"/>
  <circle cx="80" cy="110" r="2" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="220" cy="30" r="1" fill="#BAE6FD"/>

  <!-- Crystalline Nebula / Sapphire Shards -->
  <g transform="translate(200, 120)">
    <polygon points="0,-60 30,-10 0,70 -30,-10" fill="url(#sapphireLight)" opacity="0.85"/>
    <polygon points="0,-60 30,-10 0,70" fill="url(#sapphireDark)" opacity="0.9"/>
    <polygon points="-40,-30 -10,-10 -20,40" fill="url(#sapphireLight)" opacity="0.6"/>
    <polygon points="40,20 15,10 25,-30" fill="url(#sapphireDark)" opacity="0.7"/>
    <!-- Center Core Glow -->
    <circle cx="0" cy="-10" r="8" fill="#BAE6FD" filter="url(#glow)" opacity="0.9"/>
  </g>
</svg>
