  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad-acid)" />
  <rect width="100%" height="100%" fill="url(#grid-acid)" />
  
  <path d="M -10 120 L 80 120 L 110 80 L 190 80 L 220 120 L 410 120" fill="none" stroke="#333" stroke-width="2" />
  <path d="M -10 130 L 75 130 L 105 170 L 205 170 L 235 130 L 410 130" fill="none" stroke="#C8F04B" stroke-width="3" filter="url(#neon-glow-acid)" />
  
  <rect x="320" y="40" width="40" height="20" fill="none" stroke="#C8F04B" stroke-width="2" filter="url(#neon-glow-acid)" transform="skewX(-15)" />
  <rect x="330" y="70" width="20" height="10" fill="#C8F04B" transform="skewX(-15)" />
  
  <circle cx="205" cy="170" r="4" fill="#C8F04B" filter="url(#neon-glow-acid)" />
  <circle cx="105" cy="170" r="4" fill="#C8F04B" filter="url(#neon-glow-acid)" />
  
  <text x="40" y="200" font-family="sans-serif" font-weight="900" font-size="24" fill="#C8F04B" filter="url(#neon-glow-acid)" letter-spacing="2" transform="skewX(-10)">CYBER_LIME</text>
