name: Keep-alive ping

on:
  schedule:
    - cron: "0 10 */2 * *"  # cada 2 días a las 10:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ytdlp-service health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RAILWAY_URL }}/health")
          echo "ytdlp-service status: $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]

      - name: Ping deezer proxy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.RAILWAY_URL }}/deezer" \
            -H "Authorization: Bearer ${{ secrets.SERVICE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"search","query":"test","limit":1}')
          echo "deezer proxy status: $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]

      - name: Keep YouTube cookies alive
        id: keepalive
        run: |
          RESP=$(curl -s -X GET \
            "${{ secrets.RAILWAY_URL }}/internal/keepalive-yt" \
            -H "Authorization: Bearer ${{ secrets.SERVICE_API_KEY }}")
          echo "YouTube keepalive: $RESP"
          echo "resp=$RESP" >> $GITHUB_OUTPUT
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('ok') else 1)"

      - name: Notificar por Telegram
        if: always()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RAILWAY_LOGS="https://railway.com/project/1e9118dc-50cd-460d-b336-35424ca02692"
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ MHL keep-alive OK — Cookies YouTube activas"
          else
            MSG="❌ MHL keep-alive FALLO — Cookies YouTube pueden haber expirado"
            MSG="$MSG%0A%0A📋 Logs GitHub Actions:%0A$RUN_URL%0A%0A🚂 Logs Railway:%0A$RAILWAY_LOGS"
          fi
          MSG="$MSG%0A$(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG" > /dev/null
