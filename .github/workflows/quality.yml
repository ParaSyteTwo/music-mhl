name: Quality

on:
  push:
  pull_request:

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run test:android-release-contract

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mhl-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mhl-desktop/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q test_bridge_candidates.py tests
